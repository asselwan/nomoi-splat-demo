<html lang="en">
<head>

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; font: 14px system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #panel { position: fixed; z-index: 2; top: 12px; left: 12px; max-width: 320px; padding: 10px 12px; border-radius: 8px; background: #101820dc; }

<body>
  <div id="panel">
    <label for="scene-picker">Scene</label>
    <select id="scene-picker" aria-label="Scene" onchange="if(this.value) location.href=this.value">
      <option value="../../">Chili-salmon bowl · .splat</option>
      <option value="../../sparse/">Sparse photo prototype</option>
      <option disabled>Fresh trained scene · pending</option>
      <option value="../">Chili-salmon bowl · SPZ</option>
